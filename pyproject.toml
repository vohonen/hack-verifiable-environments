[project]
name = "hack-verifiable-environments"
version = "0.1.0"
description = "Hack-Verifiable Environments for evaluating LLM agent hacking tendencies"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Amit Roth" },
]
requires-python = ">=3.10"
keywords = ["llm", "agents", "security", "hacking", "evaluation", "reinforcement-learning"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "textarena",
    "nltk",
    "loguru>=0.7.3",
    "tqdm>=4.0",
]

[project.optional-dependencies]
rl = [
    "openai>=1.0",
    "pyarrow>=15",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "black",
    "ruff",
]

[project.urls]
Homepage = "https://majaroth.github.io/hack-verifiable-environments"
Repository = "https://github.com/MajoRoth/hack-verifiable-environments"
"Bug Tracker" = "https://github.com/MajoRoth/hack-verifiable-environments/issues"

[tool.uv.sources]
textarena = { git = "https://github.com/TextArena/TextArena.git", rev = "a2c896c5c84c8557d78d3d9182a066ff573daf44" }

# Without a build-system uv treats the project as virtual and never installs it, so the repo
# root on sys.path is what makes `import hvta` work locally. The training pods install the
# package from git, which builds a wheel; setuptools' auto-discovery then trips over the other
# top-level directories (experiments/, integrations/). Hatchling with the package named ships
# every file under hvta/, including the agent-loop yaml, the planted-bug game directories and
# the past-game markdown, none of which have __init__.py.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hvta"]
